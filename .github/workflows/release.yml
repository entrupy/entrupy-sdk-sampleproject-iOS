# Release gate for the Sample App.
#
# check   (every run): the SDK version the project is released against must already be
#         published, i.e. tag <ver> must exist in entrupy/entrupy-sdk-iOS. When the
#         project links the SDK as a Swift package the package graph is also resolved.
# merge   (pull_request from release/<ver>, after check): merges the PR, tags the squash
#         commit and creates the GitHub release. The PR's own run fails at check while
#         the SDK is unpublished; the SDK publish pipeline re-runs it right after tagging
#         the SDK, so no human touches the Sample App release.
#         Only runs of the pull_request event count toward the required status check,
#         so this is deliberately not a workflow_dispatch job.
# publish (push to master, after check): fallback for a PR merged by hand.
#
# The version is read by .github/scripts/sdk-version.sh (SPM pin, else README footer).
name: Release

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: macos-latest
    concurrency:
      group: check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Read the SDK version from the project
        id: ver
        run: .github/scripts/sdk-version.sh

      - name: SDK tag must exist in entrupy/entrupy-sdk-iOS
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          git ls-remote --exit-code --tags https://github.com/entrupy/entrupy-sdk-iOS.git "refs/tags/$VER" \
            || { echo "::error::SDK $VER is not tagged in entrupy/entrupy-sdk-iOS yet. Merge the SDK release PR; its publish pipeline re-runs this workflow. To retry by hand: Re-run jobs."; exit 1; }

      - name: Resolve the SDK package
        if: steps.ver.outputs.spm == 'true'
        run: xcodebuild -resolvePackageDependencies -project "Sample App.xcodeproj" -scheme "Sample App" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"

  merge:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the SDK version from the project
        id: ver
        run: .github/scripts/sdk-version.sh

      - name: Merge the release PR, then tag and release
        env:
          VER: ${{ steps.ver.outputs.ver }}
          BRANCH: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ "$BRANCH" = "release/$VER" ] \
            || { echo "::error::PR branch is '$BRANCH' but the project says SDK $VER; expected release/$VER."; exit 1; }
          STATE=$(gh pr view "$PR" --json state --jq .state)
          if [ "$STATE" = "MERGED" ]; then
            MERGED=$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)
            echo "PR #$PR already merged at $MERGED"
          else
            gh pr merge "$PR" --squash --subject "Release $VER" --body "Sample App for Entrupy SDK $VER."
            MERGED=$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)
            echo "Merged PR #$PR at $MERGED"
          fi
          .github/scripts/publish-release.sh "$VER" "$MERGED"

  publish:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the SDK version from the project
        id: ver
        run: .github/scripts/sdk-version.sh

      - name: Tag and release
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: .github/scripts/publish-release.sh "$VER" "$GITHUB_SHA"
