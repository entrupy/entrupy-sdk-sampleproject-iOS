# Release gate for the Sample App.
#
# check   (pull_request / workflow_dispatch): the SDK version the project is released
#         against must already be published, i.e. tag <ver> must exist in
#         entrupy/entrupy-sdk-iOS. Re-run it after the SDK ships: GitHub has no
#         cross-repo tag trigger. When the project links the SDK as a Swift package the
#         package graph is also resolved as a build sanity check.
# publish (push to master): tag the merged version and create the GitHub release.
#
# The version is read by .github/scripts/sdk-version.sh (SPM pin, else README footer).
name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: macos-latest
    concurrency:
      group: check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Read the SDK version from the project
        id: ver
        run: .github/scripts/sdk-version.sh

      - name: SDK tag must exist in entrupy/entrupy-sdk-iOS
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          git ls-remote --exit-code --tags https://github.com/entrupy/entrupy-sdk-iOS.git "refs/tags/$VER" \
            || { echo "::error::SDK $VER is not tagged in entrupy/entrupy-sdk-iOS yet. Merge the SDK release PR first, then re-run this check."; exit 1; }

      - name: Resolve the SDK package
        if: steps.ver.outputs.spm == 'true'
        run: xcodebuild -resolvePackageDependencies -project "Sample App.xcodeproj" -scheme "Sample App" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the SDK version from the project
        id: ver
        run: .github/scripts/sdk-version.sh

      - name: Tag and release
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "Release $VER already exists, nothing to do"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$VER" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/$VER" >/dev/null; then
            echo "::error::Tag $VER already exists but has no GitHub release. Check what the tag points at and create the release by hand; this job never moves or deletes tags."
            exit 1
          fi
          git tag "$VER"
          git push origin "$VER"
          gh release create "$VER" --title "Release $VER" \
            --notes "Sample App for Entrupy SDK $VER. SDK release: https://github.com/entrupy/entrupy-sdk-iOS/releases/tag/$VER"
